research:
  - key: gaze
    index: "01"
    title:
      zh: 眼动与注视交互
      en: Gaze-based Interaction
    summary:
      zh: >-
        研究注视、平滑追踪与自主眨眼作为输入通道时的识别方式、选取精度与视觉负荷，并在遮挡、小目标、老年用户等条件下评估可用性。
      en: >-
        Recognition, selection accuracy and visual load when gaze, smooth pursuit and voluntary blinking are used as input channels, evaluated under conditions such as occlusion, small targets and older users.
    keywords: [Eye Tracking, Smooth Pursuit, Voluntary Blink, Gaze Selection]
    related: [fan2024blink, fan2026clarity]
  - key: bci
    index: "02"
    title:
      zh: 脑机接口
      en: Brain–Computer Interfaces
    summary:
      zh: >-
        SSVEP 范式下的视觉刺激设计与接口性能，以及脑机接口与外部设备之间链路的实现方式，包括可拉伸电极等硬件基础。
      en: >-
        Visual stimulus design and interface performance in SSVEP paradigms, together with the implementation of links between a BCI and external devices, including hardware such as stretchable electrodes.
    keywords: [BCI, SSVEP, Metasurface, Stretchable Electrodes]
    related: [xiao2025metasurface, li2026electrodes]
  - key: haptics
    index: "03"
    title:
      zh: 空中超声触觉
      en: Mid-Air Ultrasonic Haptics
    summary:
      zh: >-
        以自建的超声相控阵装置为实验平台，研究阵列布局、聚焦策略与触觉可感知性，并探索无接触反馈在界面中的调用方式。
      en: >-
        Array layout, focusing strategies and tactile perceptibility studied on a self-built ultrasonic phased array, together with ways of invoking contactless feedback from an interface.
    keywords: [Ultrasonic Haptics, Phased Array, Focusing, Perception]
    related: []
  - key: method
    index: "04"
    title:
      zh: 实验方法与原型系统
      en: Methods & Prototype Systems
    summary:
      zh: >-
        支撑用户实验的工程部分：实验流程管理、生理与行为信号采集、数据分析脚本，以及可重复使用的硬件与软件开发。
      en: >-
        The engineering side of running user studies — experiment workflow management, physiological and behavioural signal acquisition, analysis scripts, and reusable hardware and software.
    keywords: [Experimental Design, Instrumentation, Unity, Data Analysis]
    related: []

