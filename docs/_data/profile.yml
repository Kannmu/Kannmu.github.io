research:
  - key: haptics
    title:
      zh: 超声触觉
      en: Ultrasonic haptics
    summary:
      zh: 研究声致触觉的感知机制、相控阵布局与聚焦策略，构建更清晰、更高效的无接触触觉反馈。
      en: Studying perception, array layouts, and focusing strategies for clearer and more efficient contactless haptic feedback.
  - key: gaze
    title:
      zh: 眼动与自然交互
      en: Gaze and natural interaction
    summary:
      zh: 通过凝视、平滑追踪与自主眨眼，探索低负担、高可用的人机交互方式。
      en: Exploring low-effort, usable interaction through gaze, smooth pursuit, and voluntary blinking.
  - key: bci
    title:
      zh: 脑机接口与智能设备
      en: BCI and smart devices
    summary:
      zh: 关注脑机接口的信息安全、无线通信及其与智能设备协同工作的交互范式。
      en: Investigating secure wireless communication and interaction paradigms connecting BCIs with smart devices.

current_projects:
  - title:
      zh: 声致触觉反馈机制
      en: Audio-induced haptic feedback
    period: 2025 - Present
    detail:
      zh: 国家自然科学基金面上项目。负责核心软硬件原型与交互系统开发，研究表面波增强和触觉工效评价。
      en: Developing core hardware, software, and evaluation methods for a National Natural Science Foundation project on surface-wave-enhanced haptics.
  - title:
      zh: UMH 超声触觉设备
      en: UMH ultrasonic haptic device
    period: V5.0
    detail:
      zh: 自研 60 阵元六边形相控阵原型，用于验证高密度阵列布局与触觉聚焦策略。
      en: A 60-element hexagonal phased-array prototype for testing dense layouts and tactile focusing strategies.
  - title:
      zh: 安全脑机通信
      en: Secure BCI communication
    period: 2023 - 2025
    detail:
      zh: 将脑电视觉刺激编码与时空编码超表面结合，建立脑机接口到智能设备的物理层安全链路。
      en: Coupling visual EEG encoding with a space-time-coding metasurface to create a physical-layer secure link to smart devices.

