bio:
  zh: 我是一名人机交互研究者与原型工程师，关注新型交互方式如何从实验室中的信号、材料和算法，转化为可理解、可使用的真实体验。
  en: I am an HCI researcher and prototype engineer exploring how signals, materials, and algorithms can become understandable, usable experiences.

