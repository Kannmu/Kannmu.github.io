lede:
  zh: >-
    东南大学设计学博士研究生，研究方向为人机交互，具体涉及眼动输入、脑机接口与空中超声触觉的交互设计与可用性评估。
  en: >-
    Ph.D. researcher in Design at Southeast University, working on human–computer interaction — specifically the interaction design and usability evaluation of gaze input, brain–computer interfaces and mid-air ultrasonic haptics.

statement:
  - zh: >-
      范林涵（涵无 / Kannmu），东南大学机械工程学院设计科学系设计学博士研究生，导师为牛亚峰教授。研究领域为人机交互，涉及眼动输入、脑机接口与空中触觉反馈。
    en: >-
      Linhan Fan (Hanwu / Kannmu) is a Ph.D. researcher in Design at the Department of Design Science, School of Mechanical Engineering, Southeast University, advised by Prof. Yafeng Niu. His research area is human–computer interaction, covering eye-based input, brain–computer interfaces and mid-air haptic feedback.
  - zh: >-
      研究方法以原型开发与用户实验为主：先搭建可运行的硬件或软件系统，再通过受控实验考察操作绩效、错误率与主观负荷，最后整理为可复用的设计参数与建议。相关成果发表于 Nature Communications、Advanced Engineering Informatics、Displays、International Journal of Human–Computer Interaction、Computers in Industry 等期刊。
    en: >-
      The research method combines prototype development with controlled user studies: a working hardware or software system is built first, its performance, error rate and perceived workload are then examined in controlled experiments, and the results are distilled into reusable design parameters and recommendations. Outcomes have appeared in Nature Communications, Advanced Engineering Informatics, Displays, the International Journal of Human–Computer Interaction and Computers in Industry.
  - zh: >-
      工程背景包括机械结构设计、嵌入式硬件与前端开发；研究中使用的大型装置（超声相控阵平台、实验流程框架等）多数由作者自行搭建并维护。
    en: >-
      The engineering background covers mechanical design, embedded hardware and front-end development; most of the larger apparatus used in the research — the ultrasonic phased-array platform, the experiment workflow framework and similar tools — was built and maintained by the author.

