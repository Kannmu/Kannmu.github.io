  citation_count: 2
  author_role: coauthor
  authors: "Ya-Feng Niu ; Yun Feng ; Xin Li ; Wei-Chi Huang ; Yi-Yan Wang ; Lin-Han Fan"
  self_name: Lin-Han Fan
  topics: [gaze, smooth-pursuit, visual-perception, user-experience]
  featured: false
  note: >-
    预印本版见 SSRN 10.2139/ssrn.5109047。
  abstract_zh: >-
    本文把「静态触发」引入平滑追踪眼动范式：用不动的触发线索诱发追踪运动，并通过界面与动效设计调节视觉感知过程，从视觉感知、操作绩效与用户体验三方面检验该范式在真实交互任务中的可用性与舒适度。
  abstract_en: >-
    Introducing static triggering into the smooth-pursuit paradigm, this study elicits pursuit with stationary trigger cues, shapes visual perception through interface and motion design, and evaluates usability and comfort across visual perception, task performance and user experience.

- id: he2026occluded
  year: 2026
  title: "Predictive Smooth Pursuit Gaze Interaction for Occluded Target Selection in Augmented Reality"
  date: 2026-12-01
  type: journal
  venue: Displays
  venue_short: Displays
  publisher: Elsevier
  volume: "95"
  pages: "103579"
  article_no: "103579"
  doi: 10.1016/j.displa.2026.103579
  citation_count: 1
  author_role: coauthor
  authors: "Hua He ; Yu Qian ; Lin-Han Fan ; Ya-Feng Niu"
  self_name: Lin-Han Fan
  topics: [gaze, smooth-pursuit, augmented-reality, occlusion]
  featured: false
  abstract_zh: >-
    在增强现实中，目标常被前景物体遮挡，眼动选取会因此失效。本文提出一种可预测的平滑追踪眼动机制，在遮挡条件下仍能推断用户意图目标，从而恢复 AR 场景中的可选择性。
  abstract_en: >-
    In augmented reality, targets are routinely occluded by foreground geometry, which breaks gaze selection. This work proposes a predictive smooth-pursuit mechanism that infers the intended target from pursuit dynamics under occlusion, restoring selectability in AR scenes.

- id: huang2026takelook
  year: 2026
  title: "Take-A-Look: Enabling intuitive distant target interactions in industrial virtual reality applications via natural gestures"
  date: 2026-12-01
  type: journal
  venue: Computers in Industry
  venue_short: Comput. Ind.
  publisher: Elsevier
  volume: "181"
  pages: "104545"
  article_no: "104545"
  doi: 10.1016/j.compind.2026.104545
  citation_count: 0
  author_role: coauthor
  authors: "Wei-Chi Huang ; Zhuo-Heng Song ; Yi-Yan Wang ; Lin-Han Fan ; Ya-Feng Niu"
  self_name: Lin-Han Fan
  topics: [virtual-reality, gesture, industry, distal-interaction]
  featured: true
  abstract_zh: >-
    Take-A-Look 面向工业虚拟现实：操作者往往需要与远处的设备交互，却又不愿在车间里大幅移动。该方法以自然手势表达「看向」的意图，把远距离目标选择变成一次直觉性的指向动作，并在工业任务情境中做了验证。
  abstract_en: >-
    Take-A-Look targets industrial virtual reality, where operators must reach distant equipment without moving around the shop floor. The method reads natural gestures as an intent to look at a target, turning distant selection into an intuitive pointing action, validated in industrial task scenarios.

- id: fan2026clarity
  year: 2026
  title: "Clarity or Context? Rebalancing Mobile Interaction for Older Adults with Gaze-Zoom-Tap"
  date: 2026-01-30
  type: journal
  venue: International Journal of Human–Computer Interaction
  venue_short: Int. J. Hum.–Comput. Interact.
  publisher: Taylor & Francis
  volume: "42"
  issue: "19"
  pages: "16075–16100"
  doi: 10.1080/10447318.2026.2619925
  citation_count: 0
  author_role: first
  authors: "LinHan Fan ; Ke Zhu ; MingJie Li ; ZhuTao Wang ; YaFeng Niu"
  self_name: LinHan Fan
  topics: [gaze, older-adults, mobile, accessibility]
  featured: true
  abstract_zh: >-
    老年用户在移动端操作时，全局放大虽然提升了可读性，却常常打碎上下文、增加体力负担。本文在「清晰度」与「上下文」之间重新分配交互预算，提出并验证了一套「注视—缩放—点按」范式，让老年用户在不失去空间定位感的前提下看清目标。
  abstract_en: >-
    Older adults face mobile interaction challenges from age-related decline. Conventional global magnification enhances legibility but fragments context and increases physical strain. Rebalancing the interaction budget between clarity and context, this work proposes and evaluates a gaze–zoom–tap paradigm that keeps targets legible without losing spatial orientation.

