- id: fan2024blink
  year: 2024
  title: "Design recommendations for voluntary blink interactions based on pressure sensors"
  date: 2024-08-01
  type: journal
  venue: Advanced Engineering Informatics
  venue_short: Adv. Eng. Inform.
  publisher: Elsevier
  volume: "61"
  pages: "102489"
  article_no: "102489"
  doi: 10.1016/j.aei.2024.102489
  citation_count: 6
  author_role: first
  authors: "Lin-Han Fan ; Wei-Chi Huang ; Xue-Qi Shao ; Ya-Feng Niu"
  self_name: Lin-Han Fan
  topics: [gaze, blink, pressure-sensing, interaction-design]
  featured: true
  note: >-
    预印本版见 SSRN 10.2139/ssrn.4695848。
  abstract_zh: >-
    在眼控人机交互中，自主眨眼是一种理想的无手输入，但由于信号微弱、又容易与自然眨眼混淆，长期缺乏可用的设计参数。本文选择低功耗的压力传感器作为感知通道，刻画自主眨眼的信号特征，并据此给出一套可直接用于界面设计的建议——覆盖触发阈值、误触抑制、反馈时机与重复输入等关键取舍，让眨眼从「可被检测的信号」变成「可被设计的交互原语」。
  abstract_en: >-
    Voluntary blink control is vital in eye-controlled human–computer interaction, yet designers lack parameter-level guidance for making it reliable. Using low-power pressure sensors as the sensing channel, this work characterises intentional blink signals and derives actionable design recommendations — triggering thresholds, false-activation suppression, feedback timing and repeated input — turning a faint physiological signal into a designable interaction primitive.

- id: huang2024takeover
  year: 2024
  title: "Enhancing safety in conditionally automated driving: Can more takeover request visual information make a difference in hazard scenarios with varied hazard visibility?"
  date: 2024-09-01
  type: journal
  venue: Accident Analysis & Prevention
  venue_short: Accid. Anal. Prev.
  publisher: Elsevier
  volume: "205"
  pages: "107687"
  article_no: "107687"
  doi: 10.1016/j.aap.2024.107687
  citation_count: 37
  author_role: coauthor
  authors: "Wei-Chi Huang ; Lin-Han Fan ; Zi-Jian Han ; Ya-Feng Niu"
  self_name: Lin-Han Fan
  topics: [automated-driving, takeover-request, safety, visual-attention]
  featured: true
  abstract_zh: >-
    在条件自动驾驶中，接管请求（TOR）界面究竟该承载多少视觉信息？本文通过工效学实验比较了「警示 + 危险方向 + 碰撞时间」等信息组合在显性危险与隐性危险场景下的作用：信息更丰富确实能改善接管绩效、提升信任并降低负荷，但在显性危险场景中反而带来分心。结论是设计应与危险的可见度水平相匹配，而不是一味堆叠信息。
  abstract_en: >-
    How much visual information should a takeover request (TOR) interface carry in conditionally automated driving? An ergonomics study comparing warning, hazard-direction and time-to-collision information across overt and covert hazards shows that richer cues do improve takeover performance, trust and workload — but in overt-hazard scenarios the same extra information distracts. Design should therefore be visibility-contingent rather than information-maximal.

- id: huang2025fisheye
  year: 2025
  title: "Enhancing gaze interaction performance: Design and optimization of perspective-driven fisheye view"
  date: 2025-05-01
  type: journal
  venue: Advanced Engineering Informatics
  venue_short: Adv. Eng. Inform.
  publisher: Elsevier
  volume: "65"
  pages: "103365"
  article_no: "103365"
  doi: 10.1016/j.aei.2025.103365
  citation_count: 7
  author_role: coauthor
  authors: "Wei-Chi Huang ; Yi-Yan Wang ; Lin-Han Fan ; Sha-Tong Yang ; Ya-Feng Niu"
  self_name: Lin-Han Fan
  topics: [gaze, fisheye, visualisation, interaction-design]
  featured: false
  abstract_zh: >-
    眼动选取在小目标上常常失准。本文设计并优化了一种「透视驱动的鱼眼视图」，在保持注视点语义稳定的同时放大候选目标区域，系统评估其对选取速度、准确率与主观负荷的影响。
  abstract_en: >-
    Gaze-based selection of small or distant targets is error-prone. This work designs and empirically optimises a perspective-driven fisheye view that magnifies candidate regions while keeping the gaze point semantically stable, evaluating its effect on selection speed, accuracy and perceived workload without losing context.

- id: xiao2025metasurface
  year: 2025
  title: "Secure wireless communication of brain–computer interface and mind control of smart devices enabled by space-time-coding metasurface"
  date: 2025-08-25
  type: journal
  venue: Nature Communications
  venue_short: Nat. Commun.
  publisher: Nature Portfolio
  volume: "16"
  issue: "1"
  pages: "7914"
  article_no: "7914"
  doi: 10.1038/s41467-025-63326-0
  citation_count: 28
  author_role: cofirst
  authors: "Qiang Xiao ; Lin Han Fan ; Qian Ma ; Yu Ming Ning ; Ze Gu ; Long Chen ; Lianlin Li ; Jian Wei You ; Ya Feng Niu ; Tie Jun Cui"
  self_name: Lin Han Fan
  topics: [bci, wireless, metasurface, security]
  featured: true
  note: >-
    预印本于 2024 年 8 月发布于 Research Square（DOI 10.21203/rs.3.rs-4860006/v1）。
  abstract_zh: >-
    如何让脑机接口「隔空」且安全地操控智能设备？本文把视觉刺激诱发的脑电编码与时空编码超表面融合：超表面以谐波加密波束在物理层同时完成调制与加密，由此建立一条从大脑到设备的受控无线指令链路，并用原型系统完成了验证。
  abstract_en: >-
    A brain–computer interface that controls smart devices without wires is only useful if the link is secure. Fusing visually evoked EEG encoding with space–time coding on a metasurface, this work uses harmonic-encrypted beams to deliver modulation and encryption at the physical layer — establishing a secure wireless brain-to-device command channel, validated with a prototype.

- id: niu2025smoothpursuit
  year: 2025
  title: "Visual perception and user experience optimization: Exploring interaction design through static-triggered smooth pursuit systems"
