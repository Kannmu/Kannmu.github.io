- id: li2026electrodes
  year: 2026
  title: "Data-driven design of disordered structures for direction- and geometry-independent stretchable electrodes"
  date: 2026-07-23
  type: journal
  venue: npj Flexible Electronics
  venue_short: npj Flex. Electron.
  publisher: Nature Portfolio
  doi: 10.1038/s41528-026-00620-x
  citation_count: 0
  author_role: cofirst
  authors: "Mengli Li ; Linhan Fan ; Yilei Fu ; Yihe Yue ; Xinyu Chen ; Jiaying Wang ; Tao Hu ; Kang Gao ; Xuan Liang ; Yumeng You ; Lei Liu ; Jinlan Wang ; Yafeng Niu ; Yunfei Chen ; Zhiyang Lyu"
  self_name: Linhan Fan
  topics: [flexible-electronics, stretchable-electrodes, data-driven-design]
  featured: false
  abstract_zh: >-
    可拉伸电极的性能强烈依赖结构与取向。本文构建「神经网络 + 进化算法」的数据驱动框架，生成仿生的无序电极结构，使其在任意拉伸方向与几何形变下都保持稳定导电：3D 打印样件的电阻变化相比有序结构降低 20–50%，并进一步做出一顶可用于脑机任务的无线可拉伸脑电帽。
  abstract_en: >-
    The performance of stretchable electrodes depends strongly on structure and orientation. A machine-learning-guided framework — neural network plus evolutionary search — generates bioinspired disordered structures that are strain-insensitive in any direction or geometry. 3D-printed samples cut resistance variation by 20–50% versus ordered designs, and enable a wireless stretchable EEG cap for BCI tasks.

- id: sun2026ssvep
  year: 2026
  title: "Effect of Auxiliary-Stimulus Quantity on Visual Enhancement in SSVEP-BCI Interfaces"
  date: 2026-08-01
  type: conference
  venue: 2026 18th International Conference on Intelligent Human-Machine Systems and Cybernetics (IHMSC)
  venue_short: IHMSC 2026
  publisher: IEEE
  pages: "89–92"
  doi: 10.1109/ihmsc70922.2026.00028
  citation_count: 0
  author_role: coauthor
  authors: "Rongqin Sun ; Zhaozhe Zhou ; Linhan Fan ; Yafeng Niu"
  self_name: Linhan Fan
  topics: [bci, ssvep, visual-enhancement]
  featured: false
  abstract_zh: >-
    在 SSVEP-BCI 界面中，辅助刺激的数量会同时影响目标的可辨识度与视觉疲劳。本文通过实验考察辅助刺激数量对视觉增强效果的调节作用，为刺激布局给出可量化的设计依据。
  abstract_en: >-
    In SSVEP-BCI interfaces, the number of auxiliary stimuli influences both target discriminability and visual fatigue. This study examines how auxiliary-stimulus quantity modulates visual enhancement, providing quantifiable design guidance for stimulus layout.

