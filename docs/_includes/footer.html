{% include site-footer.html %}

<!-- ==========================================================================
     Scripts
     ========================================================================== -->
<!-- jQuery (legacy pages, catalog, search) -->
<script src="{{ "/js/jquery.min.js" | prepend: site.baseurl }}"></script>

<!-- Simple Jekyll Search -->
<script src="{{ "/js/simple-jekyll-search.min.js" | prepend: site.baseurl }}"></script>

<!-- Service worker -->
{% if site.service-worker %}
<script src="{{ "/js/snackbar.js" | prepend: site.baseurl }}"></script>
<script src="{{ "/js/sw-registration.js" | prepend: site.baseurl }}"></script>
{% endif %}

<!-- async load helper -->
<script>
  function async(u, c) {
    var d = document, t = 'script', o = d.createElement(t), s = d.getElementsByTagName(t)[0];
    o.src = u;
    if (c) { o.addEventListener('load', function (e) { c(null, e); }, false); }
    s.parentNode.insertBefore(o, s);
  }
</script>

<!-- Side catalog (posts only) -->
{% unless page.no-catalog %}
<script type="text/javascript">
  function generateCatalog(selector) {
    var P = $('div.post-container');
    var a = P.find('h2,h3,h4');
    $(selector).html('');
    a.each(function () {
      var n = $(this).prop('tagName').toLowerCase();
      var i = '#' + $(this).prop('id');
      var t = $(this).text();
      var c = $('<a href="' + i + '" rel="nofollow">' + t + '</a>');
      var l = $('<li class="' + n + '_nav"></li>').append(c);
      $(selector).append(l);
    });
    return true;
  }

  if (document.querySelector('.catalog-body')) {
    generateCatalog('.catalog-body');
    $('.catalog-toggle').click(function (e) {
      e.preventDefault();
      $('.side-catalog').toggleClass('fold');
    });
    async("{{ '/js/jquery.nav.js' | prepend: site.baseurl }}", function () {
      $('.catalog-body').onePageNav({
        currentClass: 'active',
        changeHash: false,
        easing: 'swing',
        filter: '',
        scrollSpeed: 700,
        scrollOffset: 0,
        scrollThreshold: 0.2,
        padding: 80
      });
    });
  }
</script>
{% endunless %}

<!-- Site interactions -->
<script src="{{ "/js/site.js" | prepend: site.baseurl }}" defer></script>
{% if page.academic_sync %}
<script src="{{ "/js/academic-sync.js" | prepend: site.baseurl }}" defer></script>
{% endif %}

<!-- Search -->
<script>
  (function () {
    function htmlDecode(input) {
      var e = document.createElement('textarea');
      e.innerHTML = input;
      return e.childNodes.length === 0 ? '' : e.childNodes[0].nodeValue;
    }

    function boot() {
      if (typeof SimpleJekyllSearch !== 'function' || !document.getElementById('search-input')) {
        return;
      }
      SimpleJekyllSearch({
        searchInput: document.getElementById('search-input'),
        resultsContainer: document.getElementById('search-results'),
        json: '{{ "/search.json" | prepend: site.baseurl }}',
        searchResultTemplate:
          '<div class="search-result"><a href="{url}"><h2>{title}</h2><p>{subtitle}</p></a></div>',
        noResultsText: '没有找到相关内容 · No results',
        limit: 50,
        fuzzy: false,
        templateMiddleware: function (prop, value) {
          if (prop === 'subtitle' || prop === 'title') {
            if (value && value.indexOf('code')) {
              return htmlDecode(value);
            }
            return value;
          }
        }
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }
  })();
</script>

{% if site.ga_track_id %}
<script async>
  var _gaId = '{{ site.ga_track_id }}';
  var _gaDomain = '{{ site.ga_domain }}';
  (function (i, s, o, g, r, a, m) {
    i['GoogleAnalyticsObject'] = r; i[r] = i[r] || function () {
      (i[r].q = i[r].q || []).push(arguments)
    }, i[r].l = 1 * new Date(); a = s.createElement(o),
      m = s.getElementsByTagName(o)[0]; a.async = 1; a.src = g; m.parentNode.insertBefore(a, m)
  })(window, document, 'script', '//www.google-analytics.com/analytics.js', 'ga');
  ga('create', _gaId, _gaDomain);
  ga('send', 'pageview');
</script>
{% endif %}

{% if site.ba_track_id %}
<script async>
  var _baId = '{{ site.ba_track_id }}';
  var _hmt = _hmt || [];
  (function () {
    var hm = document.createElement('script');
    hm.src = '//hm.baidu.com/hm.js?' + _baId;
    var s = document.getElementsByTagName('script')[0];
    s.parentNode.insertBefore(hm, s);
  })();
</script>
{% endif %}
