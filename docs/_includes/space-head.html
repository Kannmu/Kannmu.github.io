<script>
(function (root, doc) {
  root.classList.add('js');

  var KEY = 'lang';
  var lang = 'zh';
  try {
    var q = new URLSearchParams(location.search).get('lang');
    if (q === 'en' || q === 'zh') { lang = q; localStorage.setItem(KEY, q); }
    else if (localStorage.getItem(KEY) === 'en') { lang = 'en'; }
  } catch (e) { /* private mode */ }

  function apply(v) {
    root.setAttribute('data-lang', v);
    root.setAttribute('lang', v === 'en' ? 'en' : 'zh-CN');
  }

  function sync() {
    var btns = doc.querySelectorAll('[data-sp-lang]');
    var cur = root.getAttribute('data-lang');
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute('aria-pressed', String(btns[i].getAttribute('data-sp-lang') === cur));
    }
  }

  apply(lang);

  doc.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-sp-lang]');
    if (!btn) return;
    var v = btn.getAttribute('data-sp-lang');
    apply(v);
    try { localStorage.setItem(KEY, v); } catch (err) { /* private mode */ }
    sync();
    // The 2D lab simulator listens for language changes to update its labels.
    doc.dispatchEvent(new CustomEvent('sp:lang', { detail: { lang: v } }));
  });

  doc.addEventListener('DOMContentLoaded', function () {
    sync();
    // Map shared ?sp=N links to their section in the normal document flow.
    var floor = Number(new URLSearchParams(location.search).get('sp'));
    if (!Number.isInteger(floor) || floor < 1) return;
    var sections = doc.querySelectorAll('main [data-sp-station]');
    var section = sections[Math.min(floor, sections.length) - 1];
    if (section) section.scrollIntoView();
  });
})(document.documentElement, document);
</script>
