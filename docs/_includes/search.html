<!-- Search overlay -->
<div class="search-page" id="searchPage" role="dialog" aria-modal="true" aria-label="站内搜索">
  <button class="search-icon-close" type="button" id="searchClose" aria-label="关闭搜索">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
      stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
      <path d="M6 6l12 12M18 6L6 18"></path>
    </svg>
  </button>
  <div class="search-main">
    <p class="sec-label" style="margin-bottom:22px">Search the archive</p>
    <form onsubmit="return false;">
      <input type="text" id="search-input" placeholder="输入关键词：眼动、Unity、论文笔记…" autocomplete="off">
    </form>
    <div id="search-results" class="mini-post-list"></div>
  </div>
</div>
