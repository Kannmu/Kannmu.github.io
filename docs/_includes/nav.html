<nav class="site-nav" aria-label="Primary navigation" data-site-nav>
  <div class="site-nav__inner">
    <a class="site-nav__brand" href="{{ '/' | prepend: site.baseurl }}" aria-label="Linhan Fan home">
      <span class="site-nav__mark" aria-hidden="true">K</span>
      <span class="site-nav__wordmark">LINHAN FAN</span>
    </a>

    <button class="site-nav__menu-button" type="button" aria-expanded="false" aria-controls="site-nav-panel" data-nav-toggle title="Open menu">
      <span class="sr-only">Open menu</span>
      <i class="glyphicon glyphicon-menu-hamburger" aria-hidden="true"></i>
    </button>

    <div class="site-nav__panel" id="site-nav-panel" data-nav-panel>
      <ul class="site-nav__links">
        {% for item in site.data.navigation %}
        <li>
          <a href="{{ item.url | prepend: site.baseurl }}"{% if page.url == item.url %} aria-current="page"{% endif %}>
            <span data-lang="zh">{{ item.label_zh }}</span><span data-lang="en">{{ item.label }}</span>
          </a>
        </li>
        {% endfor %}
      </ul>

      <div class="site-nav__tools">
        {% if page.multilingual %}
        <button class="site-nav__language" type="button" data-language-toggle aria-label="Switch language" title="Switch language">
          <span data-language-label>EN</span>
        </button>
        {% endif %}
        <button class="site-nav__icon" type="button" data-theme-toggle aria-label="Switch color theme" title="Switch color theme">
          <i class="glyphicon glyphicon-adjust" aria-hidden="true" data-theme-icon></i>
        </button>
        <button class="site-nav__icon search-icon" type="button" aria-label="Search articles" title="Search articles">
          <i class="glyphicon glyphicon-search" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </div>
</nav>
