<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'zh-CN' }}">

{% include head.html %}

<body class="{% if page.body-class %}{{ page.body-class }} {% endif %}{% if page.url == '/' %}page-root{% else %}{{ page.url | slugify }}{% endif %}" ontouchstart="">

    <a class="skip-link" href="#main">跳转到正文 · Skip to content</a>

    {% include site-nav.html %}
    {% include search.html %}

    <main id="main">
        {{ content }}
    </main>

    {% include footer.html %}

    <!-- Image hack for WeChat preview -->
    <img src="/img/icon_wechat.png" width="0" height="0" alt="" aria-hidden="true" />

</body>

</html>
